<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- #4F46E5 / #817AFF = --color-accent (light / dark). Keep in sync with globals.css.
       Simplified vs the Logo component: thicker stroke and no centre dot, because
       at 16px favicon size the dot merges with the arc into a blob. -->
  <style>
    .sq { fill: #4F46E5 }
    @media (prefers-color-scheme: dark) { .sq { fill: #817AFF } }
  </style>
  <rect class="sq" width="64" height="64" rx="16" />
  <path d="M46 20 A18 18 0 1 0 46 44" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" />
</svg>
